<!DOCTYPE html>
<html>
<head>
  <title>Tab Audio Recorder</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Tab Audio Recorder</h1>
      <div id="recording-status">Ready to record</div>
      <div class="controls">
        <button id="start-recording" class="btn">Record</button>
        <button id="stop-recording" class="btn" disabled>Stop</button>
      </div>
    </div>
    
    <div class="recordings-container">
      <h2>Recordings</h2>
      <div id="recordings-list">
        <div class="no-recordings">No recordings yet</div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
